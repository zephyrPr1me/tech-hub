[project]
name = "techhub-uz"
version = "0.0.1"
description = "Smart Tech Hub"
authors = [
    {name = "Hailrake",email = "qwetprime7@gmail.com"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pydantic (>=2.14.0,<3.0.0)",
    "selectolax (>=1.0.0,<2.0.0) ; python_version == \"3.14\"",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^1.0"
ruff = ">=0.9"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["backend/src", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
